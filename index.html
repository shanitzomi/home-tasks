<!DOCTYPE html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>משימות הבית</title>
<style>
:root{--bg:#f1ebff;--card:#fff;--tx:#2f2a45;--mut:#7d77a0;--ok:#2e9e6b;--no:#e53935;--bd:#ddd6f5;--hd:#7e57c2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1830;--card:#27233f;--tx:#f0edff;--mut:#aaa4cf;--bd:#3d3760;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1830;--card:#27233f;--tx:#f0edff;--mut:#aaa4cf;--bd:#3d3760;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;min-height:100vh;padding:14px 14px 40px;max-width:560px;margin:0 auto}
h1{margin:6px 0 12px;text-align:center;font-size:30px;color:var(--hd)}
.kids{display:flex;gap:8px}
.kid{flex:1;border:3px solid transparent;border-radius:24px 24px 8px 8px;padding:10px 4px;text-align:center;font-size:18px;font-weight:700;color:#fff;cursor:pointer;opacity:.55;font-family:inherit}
.kid.on{opacity:1;border-color:var(--tx);transform:scale(1.04)}
.kid span{display:block;font-size:32px}
.kid small{display:block;font-size:12px;font-weight:600}
.days{display:flex;gap:5px;margin:14px 0;overflow-x:auto;padding-bottom:4px}
.day{flex:1;min-width:44px;border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 2px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.day.on{background:var(--hd);color:#fff;border-color:var(--hd)}
.day.today::after{content:"•";display:block;line-height:6px}
.ban{border-radius:18px;padding:12px 14px;font-weight:700;font-size:17px;text-align:center;margin-bottom:12px;background:var(--card);border:2px solid var(--bd)}
.ban.win{background:#fff3c4;color:#6a4b00;border-color:#ffd54f}
.ban.lose{background:#ffe3e1;color:#a3231d;border-color:#ef9a9a}
.bar{height:12px;background:var(--bd);border-radius:8px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:8px;transition:width .3s}
.sec{font-size:20px;font-weight:800;color:var(--hd);margin:16px 4px 8px}
.task{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--bd);border-radius:14px;padding:10px;margin-bottom:8px}
.task.done{border-color:var(--ok)}
.task.miss{border-color:var(--no)}
.ic{font-size:30px}
.inf{flex:1}
.inf b{font-size:17px;display:block}
.inf small{color:var(--mut)}
.chk{width:54px;height:54px;border-radius:14px;border:3px solid var(--bd);background:var(--card);font-size:28px;cursor:pointer;color:var(--ok);font-family:inherit}
.chk.on{background:var(--ok);color:#fff;border-color:var(--ok)}
.chk.x{background:var(--no);color:#fff;border-color:var(--no)}
.chk:disabled{opacity:.45;cursor:default}
.hp{width:44px;height:44px;border-radius:14px;border:2px dashed var(--bd);background:transparent;font-size:24px;cursor:pointer;filter:grayscale(1);opacity:.5}
.hp.on{filter:none;opacity:1;border:2px solid #ffc107;background:#fff8d6}
.hp:disabled{cursor:default}
.scr{border-radius:18px;padding:12px 14px;margin-top:16px;background:var(--card);border:2px solid var(--bd)}
.scr.open{border-color:var(--ok);background:#e6f7ee;color:#14513a}
.scr.lock .rows{opacity:.5}
.scr b{font-size:17px;display:block;margin-bottom:8px}
.row{display:flex;justify-content:space-between;padding:5px 0;font-size:16px;border-top:1px solid var(--bd)}
.none{text-align:center;color:var(--mut);padding:24px}
.par{margin-top:18px;text-align:center}
.par button.lock{border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:10px 18px;font-size:15px;cursor:pointer;font-family:inherit}
.par input{font-size:18px;width:110px;text-align:center;padding:8px;border-radius:12px;border:2px solid var(--bd);background:var(--card);color:var(--tx)}
.ov{background:var(--card);border:2px solid var(--bd);border-radius:18px;padding:10px 14px;margin-top:12px;text-align:right}
.ov div{display:flex;justify-content:space-between;padding:4px 0;font-size:16px}
.tag{font-size:13px;color:var(--mut)}
.ov svg{width:22px;height:22px;vertical-align:middle}
.kid svg{width:38px;height:38px;display:block;margin:0 auto 2px}
</style></head><body>
<h1>🏠 משימות הבית</h1>
<div id="app"></div>
<script>
var Y='ישי',M='מאור',R='יאיר';
function rubik(){var C=[['#e53935','#fafafa','#1e88e5'],['#fdd835','#e53935','#43a047'],['#fb8c00','#1e88e5','#fafafa']],s='<svg viewBox="0 0 30 30"><rect width="30" height="30" rx="4" fill="#222"/>';for(var r=0;r<3;r++)for(var c=0;c<3;c++)s+='<rect x="'+(1.5+c*9)+'" y="'+(1.5+r*9)+'" width="8" height="8" rx="1.5" fill="'+C[r][c]+'"/>';return s+'</svg>'}
function creeper(){var B=[[0,0],[3,0],[6,1],[1,2],[7,3],[0,4],[7,6],[0,7],[4,7]],K=[[1,2],[2,2],[1,3],[2,3],[5,2],[6,2],[5,3],[6,3],[3,4],[4,4],[2,5],[3,5],[4,5],[5,5],[2,6],[5,6]],s='<svg viewBox="0 0 8 8" shape-rendering="crispEdges"><rect width="8" height="8" fill="#5cb85c"/>';B.forEach(function(p){s+='<rect x="'+p[0]+'" y="'+p[1]+'" width="1" height="1" fill="#3f8f43"/>'});K.forEach(function(p){s+='<rect x="'+p[0]+'" y="'+p[1]+'" width="1" height="1" fill="#111"/>'});return s+'</svg>'}
var KIDS={};KIDS[Y]={c:'#26a69a',e:rubik()};KIDS[M]={c:'#ec407a',e:creeper()};KIDS[R]={c:'#5c6bc0',e:'⚽'};
var P=[
{n:'בוקר',i:'🌞',t:[{id:'wake',t:'לקום אחרי 6:15',i:'⏰'},{id:'teeth',t:'לצחצח שיניים',i:'🪥'},{id:'shoes',t:'לשים נעליים וכיפה',i:'👟'},{id:'pill',t:'לשתות כדור',i:'💊'},{id:'lunch',t:'אוכל בתיק',i:'🥪'},{id:'bus',t:'לצאת להסעה',i:'🚌'}]},
{n:'צהריים',i:'☀️',t:[{id:'eat',t:'לאכול צהריים',i:'🍽️'},{id:'bag',t:'לשים תיק ונעליים במקום',i:'🎒'},{id:'room',t:'לסדר את החדר ואת המשחקים במקום',i:'🧸'},{id:'friends',t:'משחק עם חברים',i:'🤝'},{id:'hw',t:'שיעורי בית / ללמוד למבחן',i:'📚'}]},
{n:'ערב',i:'🌙',t:[{id:'shower',t:'מקלחת',i:'🚿'},{id:'towel',t:'מגבת למקום',i:'🧺'},{id:'dinner',t:'ארוחת ערב ולפנות את הכלים מהשולחן',i:'🍲'},{id:'own',t:'משימה אישית',i:'⭐',w:'ניקוי פחים · כביסה · מדיח · סידור משחקים'}]}];
var DT=[{id:'d_food',t:'אוכל ומים',i:'🥣'},{id:'d_pee',t:'ניקיון פיפי',i:'💧'},{id:'d_poop',t:'ניקיון קקי',i:'💩'},{id:'d_am',t:'טיול בוקר',i:'🌅',w:'5:00–7:20'},{id:'d_noon',t:'טיול צהריים',i:'☀️',w:'14:00–17:30'},{id:'d_eve',t:'טיול ערב',i:'🌙',w:'18:00–20:30'}];
var SCH=[[Y,M,R,Y,R,M],[M,R,Y,M,R,Y],[R,Y,M,R,Y,M],[Y,M,R,Y,M,R],[M,R,Y,M,R,Y],[R,Y,M,R,Y,M],[Y,M,R,Y,M,R]];
function secs(k,d){var t=[];DT.forEach(function(x,i){if(SCH[d][i]===k)t.push(x)});t.push({id:'d_play',t:'משחק עם שוקו',i:'🎾',w:'15 דקות'});return P.concat([{n:'שוקו הכלב',i:'🐶',t:t}])}
function allT(k,d){var o=[];secs(k,d).forEach(function(s){o=o.concat(s.t)});return o}
var D={טלוויזיה:'📺',מחשב:'💻',טאבלט:'📱'};
var SC={};
SC[Y]=[['14:15','מחשב'],['15:00','טלוויזיה'],['16:00',0],['18:30','טאבלט'],['19:00','מחשב'],['19:30','טלוויזיה'],['20:00',0]];
SC[M]=[['14:15','טאבלט'],['15:00','מחשב'],['16:00',0],['18:30','טלוויזיה'],['19:00','טאבלט'],['19:30','מחשב'],['20:00',0]];
SC[R]=[['14:15','טלוויזיה'],['15:00','טאבלט'],['16:00',0],['18:30','מחשב'],['19:00','טלוויזיה'],['19:30','טאבלט'],['20:00',0]];
var DN=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
var PIN='1234';
var now=new Date(),today=now.getDay();
var ws=new Date(now.getFullYear(),now.getMonth(),now.getDate()-today);
var KEY='home-'+ws.getFullYear()+'-'+(ws.getMonth()+1)+'-'+ws.getDate();
var data={};
try{data=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){data={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
// סנכרון בין מכשירים: הדביקי כאן את כתובת מסד הנתונים של Firebase, למשל https://my-app-default-rtdb.firebaseio.com
var SYNC_URL='https://tzomi-home-default-rtdb.firebaseio.com';
var lastW=0,online=true,first=true,SP='home/'+KEY;
function api(m,body){if(!SYNC_URL)return;lastW=Date.now();fetch(SYNC_URL.replace(/\/$/,'')+'/'+SP+'.json',{method:m,headers:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)}).then(function(){online=true}).catch(function(){online=false})}
function pull(){if(!SYNC_URL||askPin||Date.now()-lastW<4000)return;
fetch(SYNC_URL.replace(/\/$/,'')+'/'+SP+'.json').then(function(r){return r.json()}).then(function(j){online=true;if(Date.now()-lastW<4000||askPin)return;
if(first){first=false;var done=false;try{done=localStorage.getItem('pushed-'+KEY)}catch(e){}
if(j===null&&Object.keys(data).length&&!done){try{localStorage.setItem('pushed-'+KEY,'1')}catch(e){}api('PUT',data);return}}
j=j||{};if(JSON.stringify(j)===JSON.stringify(data)){return}
data=j;save();render()}).catch(function(){online=false})}
setInterval(pull,5000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)pull()});
var kid=Y,day=today,parent=false,askPin=false,bad=false,conf=false;
function kk(d,id,k){return d+'|'+id+'|'+k}
function rec(d,t,k){return data[kk(d,t.id,k)]||{}}
function dayDone(k,d){var L=allT(k,d);for(var i=0;i<L.length;i++){if(!rec(d,L[i],k).d)return false}return true}
function closed(d){var n=new Date();return d<today||(d===6&&today===6&&n.getHours()>=21)}
function week(k){var tot=0,done=0,miss=0,worst=0;for(var d=0;d<7;d++){var dm=0;allT(k,d).forEach(function(t){tot++;if(rec(d,t,k).d)done++;else if(closed(d)){miss++;dm++}});if(dm>worst)worst=dm}var st=(miss>=6||worst>=2)?'lose':((done===tot||closed(6))?'win':'prog');return{tot:tot,done:done,miss:miss,worst:worst,st:st}}
function badge(w){return w.st==='lose'?'❌':(w.st==='win'?'🎁':w.done+'/'+w.tot)}
function tog(d,id,f){var key=kk(d,id,kid);var r=data[key]||{};r[f]=!r[f];if(f==='d'&&!r.d)r.h=false;data[key]=r;save();var o={};o[key]=r;api('PATCH',o);render()}
function pick(k){kid=k;render()}
function setDay(d){day=d;render()}
function lock(){if(parent){parent=false;askPin=false}else askPin=true;bad=false;render()}
function tryPin(){var v=document.getElementById('pin').value;if(v===PIN){parent=true;askPin=false;bad=false}else bad=true;render()}
function setConf(v){conf=v;render()}
function resetAll(){data={};save();api('DELETE');conf=false;day=today;render()}
function banner(k){var w=week(k),pct=w.tot?Math.round(w.done/w.tot*100):0,cls='',txt;
if(w.st==='lose'){cls='lose';txt='❌ אין הפתעה במוצאי שבת – '+(w.miss>=6?'חסרות '+w.miss+' משימות בשבוע':'חסרו יותר ממשימה אחת ביום אחד')}
else if(w.st==='win'){cls='win';txt='🎁 כל הכבוד! מגיעה לך הפתעה במוצאי שבת!'}
else txt='⭐ '+w.done+' מתוך '+w.tot+' משימות · חסרות עד כה: '+w.miss+' מתוך 5 מותרות. אסור לפספס יותר ממשימה אחת ביום';
return '<div class="ban '+cls+'">'+txt+'<div class="bar"><i style="width:'+pct+'%"></i></div></div>'}
function render(){
var h='<div class="kids">';
[Y,M,R].forEach(function(k){var w=week(k);var s=badge(w);
h+='<button class="kid'+(k===kid?' on':'')+'" style="background:'+KIDS[k].c+'" onclick="pick(\''+k+'\')"><span>'+KIDS[k].e+'</span>'+k+'<small>'+s+'</small></button>'});
h+='</div><div class="days">';
for(var d=0;d<7;d++)h+='<button class="day'+(d===day?' on':'')+(d===today?' today':'')+'" onclick="setDay('+d+')">'+DN[d]+'</button>';
h+='</div>'+banner(kid);
var fut=day>today,can=function(){return parent||day===today};
secs(kid,day).forEach(function(p){
h+='<div class="sec">'+p.i+' '+p.n+'</div>';
p.t.forEach(function(t){var r=rec(day,t,kid),miss=!r.d&&closed(day);
h+='<div class="task'+(r.d?' done':'')+(miss?' miss':'')+'"><div class="ic">'+t.i+'</div><div class="inf"><b>'+t.t+'</b>'+((t.w||fut)?'<small>'+(t.w||'')+(fut?(t.w?' · ':'')+'עוד לא היום':'')+'</small>':'')+'</div>';
if(r.d||parent)h+='<button class="hp'+(r.h?' on':'')+'" '+(parent&&r.d?'onclick="tog('+day+',\''+t.id+'\',\'h\')"':'disabled')+'>😊</button>';
h+='<button class="chk'+(r.d?' on':'')+(miss?' x':'')+'" '+(can()?'onclick="tog('+day+',\''+t.id+'\',\'d\')"':'disabled')+'>'+(miss?'✗':'✓')+'</button></div>'})});
var ok=dayDone(kid,day),tm=DN[(day+1)%7];
h+='<div class="scr '+(ok?'open':'lock')+'"><b>'+(ok?'🎉 עשית הכול! מחר (יום '+tm+') מותר מסך':'🔒 מסך למחר (יום '+tm+') – צריך לסיים את כל משימות היום')+'</b><div class="rows">';
SC[kid].forEach(function(s){h+='<div class="row"><span>'+s[0]+'</span><span>'+(s[1]?D[s[1]]+' '+s[1]:'🔌 מכבים הכל')+'</span></div>'});
h+='</div></div><div class="par">';
if(parent){h+='<button class="lock" onclick="lock()">🔓 יציאה ממצב הורים</button><div class="tag" style="margin-top:8px">מצב הורים: אפשר לסמן 😊 על משימה שנעשתה בשמחה ולתקן ימים קודמים</div><div class="ov">';
[Y,M,R].forEach(function(k){var w=week(k);var hs=0;for(var d=0;d<7;d++)allT(k,d).forEach(function(t){if(rec(d,t,k).h)hs++});
h+='<div><b>'+KIDS[k].e+' '+k+'</b><span>'+(w.st==='lose'?'❌ אין הפתעה':(w.st==='win'?'🎁 הפתעה!':w.done+'/'+w.tot))+' · חסרות '+w.miss+' · 😊 '+hs+'</span></div>'});
h+='</div>';
if(conf)h+='<div class="ov" style="text-align:center"><b>למחוק את כל הסימונים של כולם?</b><br><br><button class="lock" style="background:var(--no);color:#fff;border-color:var(--no)" onclick="resetAll()">כן, לאפס</button> <button class="lock" onclick="setConf(false)">ביטול</button></div>';
else h+='<div style="margin-top:14px"><button class="lock" onclick="setConf(true)">🔄 איפוס לשבוע חדש</button></div>';
}
else if(askPin){h+='<input id="pin" type="password" inputmode="numeric" placeholder="קוד הורים"> <button class="lock" onclick="tryPin()">אישור</button>'+(bad?'<div class="tag" style="color:var(--no)">קוד שגוי</div>':'')}
else h+='<button class="lock" onclick="lock()">🔒 מצב הורים</button>';
h+='</div>';
h+=(SYNC_URL?'<div class="tag" style="text-align:center;margin-top:14px">'+(online?'🟢 הסימונים מסונכרנים בין המכשירים':'🔴 אין חיבור – הסימונים נשמרים במכשיר')+'</div>':'');
document.getElementById('app').innerHTML=h}
render();pull();
</script></body></html>
